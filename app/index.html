<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA VI Trophy Guide</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Demo indicator -->
  <div class="demo-indicator" id="demoIndicator" style="position:fixed; top:20px; right:20px; background:var(--accent-amber); color:#0a0f1a; padding:8px 12px; border-radius:6; font-size:0.7rem; font-weight:600; display:none;">
    DEMO MODE - Progress will not be saved permanently
  </div>

  <header>
    <h1>GTA VI Trophy Guide</h1>
    <div class="progress" id="progress">0 of 55 earned (0%)</div>
  </header>

  <div class="controls">
    <label>Grade <select id="grade"><option value="all">All</option><option value="platinum">Platinum</option><option value="gold">Gold</option><option value="silver">Silver</option><option value="bronze">Bronze</option></select></label>
    <label>Kind <select id="kind"><option value="all">All</option><option value="platinum">Platinum</option><option value="story">Story</option><option value="side-story">Side Story</option><option value="activities">Activities</option><option value="collectibles">Collectibles</option><option value="robberies">Robberies</option><option value="partner">Partner</option><option value="world">World</option><option value="money">Money</option><option value="misc">Misc</option></select></label>
    <label>Search <input id="search" type="text" placeholder="Search trophies..."></label>
    <label>Missable <input type="checkbox" id="missable"></label>
    <label>Spoilers <input type="checkbox" id="spoilers" checked></label>
    <button id="export" type="button">Export progress</button>
    <button id="view-roadmap" class="view-button" data-view="roadmap">Roadmap</button>
    <button id="view-stats" class="view-button" data-view="stats">Stats</button>
    <label class="import">Import <input id="import" type="file" accept="application/json"></label>
    <button id="reset" type="button">Reset</button>
  </div>

  <div class="trophy-grid" id="trophy-grid"></div>

  <!-- Roadmap Section -->
  <div id="roadmap-section" style="display:none;"></div>

  <!-- Stats Section -->
  <div id="stats-section" style="display:none;"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
